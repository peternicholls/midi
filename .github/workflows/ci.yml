name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  regression:
    name: Build and regression tests
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Clean build
        run: make clean

      - name: Build
        run: make

      - name: Regression tests
        run: make test

      - name: Version smoke test
        run: |
          expected="$(tr -d '[:space:]' < VERSION)"
          actual="$(./midi --version)"
          test "$actual" = "midi $expected"
