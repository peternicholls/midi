name: Release Check

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release-regression:
    name: Validate release tag
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="${GITHUB_REF_NAME#v}"

          if [ "$version" != "$tag" ]; then
            echo "VERSION ($version) does not match tag ($GITHUB_REF_NAME)" >&2
            exit 1
          fi

          case "$version" in
            *-dev)
              echo "Do not publish release tags for -dev versions" >&2
              exit 1
              ;;
          esac

      - name: Clean build
        run: make clean

      - name: Build
        run: make

      - name: Regression tests
        run: make test

      - name: Version smoke test
        run: |
          expected="$(tr -d '[:space:]' < VERSION)"
          actual="$(./midi --version)"
          test "$actual" = "midi $expected"
